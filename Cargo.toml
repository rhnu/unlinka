[workspace]
members = ["modules/core", "modules/app", "modules/validation", "modules/xtask"]
default-members = ["modules/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
unlinka-core = { path = "modules/core" }
unlinka-validation = { path = "modules/validation" }
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
ctrlc = "3.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.11.0"
unicode-segmentation = "1.13.3"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

