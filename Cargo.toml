[workspace]
members = ["modules/core", "modules/app", "modules/validation", "modules/xtask", "modules/integration", "modules/launcher", "modules/i18n", "modules/desktop", "modules/shell", "modules/ui"]
default-members = ["modules/app"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
unlinka-core = { path = "modules/core" }
unlinka-validation = { path = "modules/validation" }
unlinka-integration = { path = "modules/integration", default-features = false }
unlinka-i18n = { path = "modules/i18n" }
unlinka-ui = { path = "modules/ui", default-features = false }
winsafe = { version = "0.0.29", features = ["user"] }
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["ApplicationModel", "Management_Deployment", "Foundation", "Foundation_Collections", "System", "Storage", "Wdk_System_SystemServices", "Win32_System_Environment", "Win32_System_Console", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
clap = { version = "4.6.7", features = ["derive", "string"] }
crossbeam-channel = "0.5.17"
ctrlc = "3.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.11.0"
unicode-segmentation = "1.13.3"
resvg = { version = "0.48.1", default-features = false }
ico = "0.6.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

