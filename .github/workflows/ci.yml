name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: RhNu/Rusteward@main
      - name: Check compilation
        run: cargo check --workspace --all-targets --locked
      - name: Check formatting
        run: cargo dev format --check --diff --locked
      - name: Lint Rust
        run: cargo dev lint --locked
      - name: Run unit tests
        run: cargo test --workspace --lib --bins --locked
      - name: Check SVG-derived icon resources
        run: cargo xtask assets --check
      - name: Run deletion acceptance tests
        run: cargo test -p unlinka --test acceptance --release --locked -- --ignored --test-threads=1 --nocapture
      - name: Run console cancellation tests
        run: cargo test -p unlinka --test cancellation --release --locked -- --ignored

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: rvben/rumdl@v0
        with:
          version: "0.2.79"
          command: check
          report-type: annotations
          args: --deny-config-warnings
