[package]
name = "unlinka-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["dialogs"]
dialogs = ["winsafe/gui", "dep:windows-sys"]

[dependencies]
winsafe.workspace = true
windows-sys = { workspace = true, features = ["Win32_UI_HiDpi"], optional = true }
