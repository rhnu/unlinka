[package]
name = "unlinka-integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["maintenance-ui"]
maintenance-ui = ["dep:unlinka-ui"]

[dependencies]
windows.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
clap.workspace = true
unlinka-i18n.workspace = true
unlinka-ui = { workspace = true, features = ["dialogs"], optional = true }

[build-dependencies]
serde_json.workspace = true

[[bin]]
name = "unlinka-maintenance"
path = "src/main.rs"
required-features = ["maintenance-ui"]
