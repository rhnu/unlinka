[package]
name = "unlinka-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
unlinka-integration.workspace = true
unlinka-i18n.workspace = true
windows-core.workspace = true
windows = { workspace = true, features = ["Win32_System_Com", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
